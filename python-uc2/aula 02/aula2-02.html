<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
    <title>Modelo de Pagina HTML 5</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="Uma página de exemplo para demonstrar 
                    a estrutura básica do HTML5 com Bootstrap e Font Awesome.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .borda {
            border-color: darkred;
            border-width: 1px;
            border-style: solid;
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>

</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body>
    <section>Exemplos de uso de Imagens</section>
    <img src="img/paisagem.jpg" alt="Pôr do Sol - Praia Grande - Arraial do Cabo" width="600px" title="Pôr do Sol - Praia Grande - Arraial do Cabo">

    <section>
        <h4>1ª Imagem</h4>
    <figure>
        <img src="img/bird-8450958_1920.png" height="300px" alt="Aqui tem uma paisagem">
        <figcaption>Figura 1: imagem de uma ave</figcaption>
    </figure>
    <hr>
    </section>

    <section>
        <h4>2ª Imagem</h4>
    <figure>
        <img src="img/christmas-6805045_1920.jpg" width="100px" alt="Feliz Natal">
        <figcaption>Figura 2: uma imagem de uma lembrança de Natal</figcaption>
    </figure>
    <hr>
    </section>

    <section>
        <h4>3ª Imagem</h4>
    <figure>
        <img src="img/field-1728099_1920.jpg" width="600px" alt="Paisagem bonita">
        <figcaption>Figura 3: Uma paisagem bonita</figcaption>
    </figure>
    <hr>
    </section>

    <section>
        <h4>4ª Imagem</h4>
    <figure>
        <img src="img/flowers-5596564_1920.png" width="600px" alt="folhas de outono">
        <figcaption>Figura 4: Uma imagem de folhas no outono</figcaption>
    </figure>
    <hr>
    </section>

    <!-- Não apague a tag "SCRIPT" -->
    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <!-- Não apague a tag "SCRIPT" -->
</body>
<!-- Final do Body-->
</html>
