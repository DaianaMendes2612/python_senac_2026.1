<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
    <title>[MUDAR]</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="[MUDAR]">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda {
           border-width: 1px;
           border-style: solid;
           border-color: black;            
        }
    </style>

</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body class="bg-secondary">
<!-- 
    DIV - Prinicipal
    Area principal do site contem o 
        - Header
        - Main 
        - Footer
 -->
<div id="div_principal" class="container adicionar_borda bg-light">
    <!--
        Header da pagina 
        [-] Logotipo 
        [-] Titulo
        [-] Menu Principal
        [-] Login / Logout / Criar conta
    -->
    <header class="adicionar_borda bg-light">
        <div class="row">
            <div class="col-12">
                LOGO/TITULO
            </div>
        </div>

        <div class="row">
            <div class="col-9">
                MENU PRINCIPAL
            </div>

            <!--LOGIN/LOGOUT-->
            <div class="col-3 text-end pe-4">
                <a href="" target="_blank"><i class="fa-solid fa-right-to-bracket" title="Clique aqui para fazer o LOGIN"></i></a>
                <a href="" target="_blank"><i class="fa-solid fa-right-from-bracket" title="Clique aqui para fazer o LOGOUT"></i></a>
            </div>
        </div>
        
    </header>

    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda bg-light">
        <!--FORMULARIO DE CADASTRO-->
        <form action="\cadastro" method="get" target="blank">

            <!--NOME COMPLETO-->
            <div class="m-3">
            <label class="form-label" for="name">Nome Completo:</label>
            <input class="form-control" type="text" id="nome" name="nome" required placeholder="Seu Nome Completo" title="Informe o seu nome completo(campo obrigatório)">
            </div>

            <!--E- MAIL LOGIN-->
            <div class="m-3">
            <label class="form-label" for="login">Login/E-mail:</label>
            <input class="form-control" type="email" id="login" name="login" required placeholder="seu login" title="Informe o seu login ou endereço de E-mail(campo obrigatório)">


            </div>
            <!--SENHA-->
            <div class="m-2 row">
                <div class="col-6">
                    <label class="form-label" for="senha">Senha:</label>
                    <input class="form-control" type="password" id="senha" name="senha" required placeholder="sua senha" 
                    title="Informe a sua senha(campo obrigatório)" minlength="6">
                </div>

            <!-- CONFIRMAR SENHA-->
                <div class="col-6">
                    <label class="form-label" for="conf_senha">Confirmar Senha:</label>
                    <input class="form-control" type="password" id="conf_senha" name="conf_senha" required placeholder="Confirme a sua senha" 
                    title="Confirme a sua senha(campo obrigatório)" minlength="6">
                </div>
                
            </div>

             <!--DATA DE NASCIMENTO-->
            <div class="m-3 row">
                <div class="col-6">
                    <label class="form-label" for="nascimento">Data de Nascimento:</label>
                    <input class="form-control" type="date" id="nascimento" name="nascimento" required placeholder="sua data de nascimento" 
                    title="Informe a sua data de nascimento(campo obrigatório)" minlength="6">
                </div>

            <!-- SEXO-->
                <div class="col-6">
                    <label class="form-label" for="sexo">Sexo:</label>
                    <select class="form-select" id="sexo" name="sexo" required title="Selecione o seu sexo (campo obrigatório)">
                        <option value="" disabled selected hidden>Selecione uma opção</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Outro">Outro</option>
                        <option value="Prefiro nao responder">Prefiro não responder</option>
                    </select>
                </div>
                
            </div>

            <!-- CPF-->
            <div class="m-3">
            <label class="form-label" for="cpf">CPF do Parceiro:</label>
            <input class="form-control" type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
            title="Digite o CPF no formato obrigatório: 000.000.000-00" placeholder="000.000.000-00">
            </div>

             <!-- TELEFONE-->
            <div class="m-3">
            <label class="form-label" for="telefone">TELEFONE:</label>
            <input class="form-control" type="tel" id="telefone" name="telefone" required placeholder="Informe o seu telefone" 
            title="Informe o seu Telefone(campo obrigatório)">
            </div>

            <!-- CEP-->
            <div class="m-3">
            <label class="form-label" for="cep">CEP:</label>
            <input class="form-control" type="text" id="cep" name="cep" required placeholder="00000-000" pattern="\d{5}-?\d{3}" title="Digite um CEP válido no formato 00000-000 ou apenas os 8 números.">
            </div>

            <!-- LOGRADOURO-->
            <div class="m-3">
            <label class="form-label" for="logradouro">Logradouro:</label>
            <input class="form-control"  type="text" id="logradouro" name="logradouro" required placeholder="Informe o seu Endereço" title="Informe o seu Logradouro(campo obrigatório)">
            </div>

            <!-- NÚMERO-->
            <div class="m-3">
            <label class="form-label" for="numero">Numero:</label>
            <input class="form-control" type="text" id="numero" name="numero" required placeholder="Informe o numero da sua residencia" title="Informe o numero da sua residencia(campo obrigatório)">
            </div>

              <!--CIDADE-->
            <div class="m-3">
            <label class="form-label" for="cidade">Cidade:</label>
            <input class="form-control" type="text" id="cidade" name="cidade" required placeholder="Informe a cidade" title="Informe a sua cidade(campo obrigatório)">
            </div>

              <!--ESTADO-->
            <div class="m-3">
            <label class="form-label" for="estado">Estado:</label>
            <input class="form-control" type="text" id="estado" name="estado" required placeholder="Informe o estado" title="Informe o seu Estado(campo obrigatório)">
            </div>

            <!--Botões-->
            <div class="m-3 row">
                <div class="col-6">
                    <button type="submit" class="form-control btn btn-outline-primary">
                        Enviar
                    </button>
                </div>

                <div class="col-6">
                    <button type="reset" class="form-control btn btn-outline-warning">
                        Limpar
                    </button>
                </div>
            </div>



        </form>

    </main>

    <!--
        Footer da pagina 
        [-] Menu Secundário
        [-] Contato
        [-] Copyright do site
        [-] Redes Sociais
    -->
    <footer class="adicionar_borda bg-light">
        <div class="row">
            <div class="col-4">
                MENU SECUNDÁRIO
            </div>

            <div class="col-5">
                CONTATO<br>
                Copyright
                
            </div>
            <div class="col-3 text-end pe-4" >
                <a href="https://github.com/" target="_blank"><i class="fa-brands fa-square-github" title="Acesse o nosso GITHUB"></i></a>
                <a href="https://www.youtube.com/" target="_blank"><i class="fa-brands fa-youtube" title="Acesse o nosso canal no YOUTUBE"></i></a>
                <a href="https://www.facebook.com/" target="_blank"><i class="fa-brands fa-facebook" title="Acesse a nossa Página no Facebook"></i></a>
                <a href="https://www.instagram.com/" target="_blank"><i class="fa-brands fa-instagram" title="Acesse o nosso Instagram"></i></a>
                <a href="https://x.com/?lang=pt" target="_blank"><i class="fa-brands fa-square-twitter" title="Acesse o nosso Twitter"></i></a>
                <a href="https://www.threads.com/?hl=pt-br" target="_blank"><i class="fa-brands fa-threads" title="Acesse o nosso Threads"></i></a>
            </div>
        </div>
    </footer>
</div> 
<!-- Final da Div Principal-->

</html>
