    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda bg-light">
        <!--FORMULARIO DE CADASTRO-->
        <form action="\cadastro" method="get" target="blank">

            <!--NOME COMPLETO-->
            <div class="m-3">
            <label class="form-label" for="name">Nome Completo:</label>
            <input class="form-control" type="text" id="nome" name="nome" required placeholder="Seu Nome Completo" title="Informe o seu nome completo(campo obrigatório)">
            </div>

            <!--E- MAIL-->
            <div class="m-3">
            <label class="form-label" for="email">E-mail:</label>
            <input class="form-control" type="email" id="email" name="email" required placeholder="exemplo@email.com" title="Informe o seu endereço de E-mail(campo obrigatório)">
            </div>


              <!--ESTADO-->
            <div class="m-3">
            <label class="form-label" for="estado">Estado:</label>
            <select class="form-select" id="estado" name="estado" required title="Selecione o seu Estado (campo obrigatório)">
                <option value="" disabled selected>Selecione o estado</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                 <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                 <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
                </select>
            </div>

             <!--CURRICULO-->
            <div class="m-3">
            <label class="form-label" for="curriculo">Currículo:</label>
            <input class="form-control" type="file" id="curriculo" name="curriculo" required accept=".pdf,.doc,.docx" 
            title="Faça o upload do seu currículo (campo obrigatório)">
            </div>

            <!--Botões-->
            <div class="m-3 row">
                <div class="col-6">
                    <button type="submit" class="form-control btn btn-outline-primary">
                        Enviar
                    </button>
                </div>

                <div class="col-6">
                    <button type="reset" class="form-control btn btn-outline-warning">
                        Limpar
                    </button>
                </div>
            </div>



        </form>
